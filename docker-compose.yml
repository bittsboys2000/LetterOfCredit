version: '3.8'

services:
  postgres-main:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lc_main
    ports:
      - "5432:5432"
    volumes:
      - pg_main_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lc_main"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-audit:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lc_audit
    ports:
      - "5433:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lc_audit"]
      interval: 5s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs

  besu:
    image: hyperledger/besu:latest
    command: ["--network=dev", "--rpc-http-enabled", "--rpc-http-cors-origins=*", "--rpc-ws-enabled", "--rpc-ws-cors-origins=*", "--miner-enabled", "--miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73"]
    ports:
      - "8545:8545"
      - "8546:8546"

  # Optional: Redis for session caching (future enhancement)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  pg_main_data:
  pg_audit_data:
  ipfs_data:
